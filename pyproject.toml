[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "prinpy"
version = "1.0.0"
license = "MIT"
description = "A high-performance package for fitting principal curves in Python"
authors = [{name = "Matthew Artuso", email = "artusoma1@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["principal curves", "dimensionality reduction", "machine learning", "statistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
neural = ["torch>=2.0"]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/artusoma/prinpy"
Repository = "https://github.com/artusoma/prinpy"
"Bug Tracker" = "https://github.com/artusoma/prinpy/issues"

[tool.maturin]
module-name = "prinpy._rs.prinpy_rs"
python-source = "."
